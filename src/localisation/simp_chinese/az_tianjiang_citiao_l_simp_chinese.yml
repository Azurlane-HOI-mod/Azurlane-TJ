l_simp_chinese:

 # 疯狂AI · 额外词条（GUI）
 az_citiao_title_text:0"§Y疯狂AI · 额外词条§!"
 az_citiao_all_text:0"§b全选§!"
 az_citiao_ok_text:0"§b确认§!"
 az_citiao_btn_on:0"§b已启用§!"
 az_citiao_btn_off:0"§b未启用§!"

 az_citiao_name_1:0"§Y舰娘对决§!"
 az_citiao_desc_1:0"强大的舰娘师可以轻易撕开玩家的防线并消灭玩家部队大量的装备，为后续其他AI部队进攻制造缺口。启用该词条会在396之后陆续给AI舰娘国生成舰娘师，极大增加玩家的防守压力。"
 az_citiao_name_2:0"§Y柴郡冲击§!"
 az_citiao_desc_2:0"舰娘列车炮猫猫头范围极大且会给予玩家部队战斗力debuff，对玩家攻守都会造成严重负面影响。启用该词条后舰娘国AI会在396之后生成柴郡列车炮。"
 az_citiao_name_3:0"§Y飞天舰娘§!"
 az_citiao_desc_3:0"机载舰娘拥有极强的作战能力，如果启用该词条，AI会使用强大的机载舰娘来确保制空权。"
 az_citiao_name_4:0"§Y钢铁之躯§!"
 az_citiao_desc_4:0"选择该词条后AI部队的HP会加强，这将导致AI的兵力损失减少，攻防数值越高其提升表现就越明显。"
 az_citiao_name_5:0"§Y高级智能§!"
 az_citiao_desc_5:0"选择该词条后会减少AI因弱智操作（底层逻辑）带来的负面效果，同时AI的将领还将获得能控制更多部队而不受惩罚，不会受伤生病，更容易破坏要塞，提高AI将领的经验获取速度等效果。"
 az_citiao_name_6:0"§Y身份检验§!"
 az_citiao_desc_6:0"该词条将加强AI的反间谍效率与加密效果，玩家将很难对舰娘国制造合作政府或者压计划。"
 az_citiao_name_7:0"§Y次元传送§!"
 az_citiao_desc_7:0"AI将在38年6月之后定期获得火星兵，从39年6月之后火星兵数量增加。火星装甲师编制固定且初始满装备+最高部队等级，火星填线师固定10步。"
 az_citiao_name_8:0"§Y身经百战§!"
 az_citiao_desc_8:0"选择该词条后AI会无视部分地形惩罚，甚至在部分地形获得正面修正。"
 az_citiao_name_9:0"§Y统治海洋§!"
 az_citiao_desc_9:0"AI会获得极为逆天的海军产出加成，不过不用担心卡顿问题。"
 az_citiao_name_10:0"§Y数值膨胀§!"
 az_citiao_desc_10:0"简单粗暴的AI攻防加成，会赢吗？"
 az_citiao_name_11:0"§Y敌我差距§!"
 az_citiao_desc_11:0"选择该词条后，玩家的队友舰娘国AI会遭受debuff惩罚，与玩家不同阵营则不再受影响。"
 az_citiao_name_12:0"§Y逆流而上§!"
 az_citiao_desc_12:0"选择该词条后，AI在与玩家对战时投降倾向过高后会获得极高的核心攻防buff。"
 az_citiao_note_text:0"如果选择了全部的词条，AI将获得额外加强，并引入特殊的游戏规则，同时玩家也会获得自选加强效果的机会"
